# Shared local infrastructure. Application services still run on the host via
# `pnpm dev` — this file only provides the backing stores they talk to.
services:
  redis:
    image: redis:7-alpine
    container_name: practical-microservice-redis
    restart: unless-stopped
    ports:
      # Host port matches the default REDIS_PORT / REDIS_URL in the services'
      # .env files, so nothing needs configuring after `docker compose up`.
      - "6379:6379"
    command:
      # AOF plus a periodic snapshot: cart state (carts, stream backlogs) then
      # survives a container restart instead of coming back empty.
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60"
      - "1"
    volumes:
      - redis-data:/data
    healthcheck:
      # `depends_on: condition: service_healthy` hangs off this once a service
      # moves into compose.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: practical-microservice-rabbitmq
    # RabbitMQ keeps its data under a directory named after the node, and the
    # node is named after the hostname. Pinning it means durable queues and
    # their messages survive `docker compose down && up`; a random container
    # hostname would leave every previous run's data orphaned on the volume.
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      # AMQP. Matches the RABBITMQ_URL default in the services' .env files.
      - "5672:5672"
      # Management UI at http://localhost:15672 — guest / guest.
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis-data:
  rabbitmq-data:
